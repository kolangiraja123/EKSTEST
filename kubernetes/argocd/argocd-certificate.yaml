apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server-tls
  namespace: argocd
spec:
  # The name of the secret that will hold the certificate
  secretName: argocd-server-tls
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
  commonName: argocd.local
  dnsNames:
    - argocd.local
    - localhost
    # Add your AWS Load Balancer DNS here if you want to use it
    # - a1234.elb.us-east-1.amazonaws.com